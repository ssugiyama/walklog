allowBuilds:
  esbuild: true
  protobufjs: true
  sharp: true
  unrs-resolver: true
  workerd: true
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.1.0
  vitest: 5.0.3
  vite-plus: 1.4.0
  "@vitest/coverage-v8": 5.0.5
  "@vitest/ui": 5.0.5
minimumReleaseAgeExclude:
  - drizzle-kit@1.0.0-rc.5
  - drizzle-orm@1.0.0-rc.5
overrides:
  vite@*: "catalog:"
  vitest@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
