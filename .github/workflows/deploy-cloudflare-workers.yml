name: Deploy to Cloudflare Workers
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      app_version:
        type: string
        required: false
        description: 'App version'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      HYPERDRIVE_ID: ${{ secrets.HYPERDRIVE_ID }}
      CLOUDFLARE_HYPERDRIVE_LOCAL_CONNECTION_STRING_HYPERDRIVE: ${{ secrets.CLOUDFLARE_HYPERDRIVE_LOCAL_CONNECTION_STRING_HYPERDRIVE }}
      KV_CACHE_ID: ${{ secrets.KV_CACHE_ID }}
    steps:
      - uses: actions/checkout@v7
      - name: Setup Vite+ and install dependencies
        uses: voidzero-dev/setup-vp@v1.21.1
        with:
          node-version: '24'
          working-directory: web
          cache: true
      - name: run lint, formatter and typecheck
        run: vp check
      - name: run test
        run: vp run test
      - name: Set Cloudflare secrets/vars
        # Pushes every non-Hyperdrive-managed variable from the reference
        # table (README.md) to Cloudflare on each deploy, so GitHub
        # Secrets/Variables are the source of truth instead of the dashboard.
        # DB_URL/DB_SSL/DB_SSL_CA and CF_WORKERS are deliberately not in this
        # list: the Workers runtime reads the DB connection from the
        # Hyperdrive binding instead of DB_URL/DB_SSL* (see lib/drizzle/db.ts),
        # and CF_WORKERS is a fixed `vars` entry in wrangler.jsonc already.
        run: |
          vp run render-wrangler-config
          for name in IMAGE_STORAGE R2_ACCOUNT_ID R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_BUCKET_NAME R2_PUBLIC_URL THEME_COLOR THEME_COLOR_LIGHT THEME_COLOR_DARK; do
            value="${!name}"
            echo "$value" | vp exec wrangler secret put "$name" --config .wrangler.generated.jsonc
          done
        env:
          IMAGE_STORAGE: ${{ vars.IMAGE_STORAGE }}
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ vars.R2_BUCKET_NAME }}
          R2_PUBLIC_URL: ${{ vars.R2_PUBLIC_URL }}
          # Read by app/layout.tsx and app/manifest.ts, which vinext renders
          # per request rather than prerendering at build time.
          THEME_COLOR: ${{ vars.THEME_COLOR }}
          THEME_COLOR_LIGHT: ${{ vars.THEME_COLOR_LIGHT }}
          THEME_COLOR_DARK: ${{ vars.THEME_COLOR_DARK }}

      - name: Deploy to Cloudflare Workers
        run: vp run deploy
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ vars.FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          NEXT_PUBLIC_MAP_TYPE_IDS: ${{ vars.MAP_TYPE_IDS }}
          NEXT_PUBLIC_DEFAULT_CENTER: ${{ vars.DEFAULT_CENTER }}
          NEXT_PUBLIC_DEFAULT_ZOOM: ${{ vars.DEFAULT_ZOOM }}
          NEXT_PUBLIC_MAP_ID: ${{ vars.MAP_ID }}
          NEXT_PUBLIC_SHAPE_STYLES_JSON_URL: ${{ vars.SHAPE_STYLES_JSON_URL }}
          NEXT_PUBLIC_THEME_JSON_URL: ${{ vars.THEME_JSON_URL }}
          # Not a wrangler.jsonc `var`: it changes every release, and
          # `wrangler types` would otherwise infer whatever value was present
          # at the last local `cf-typegen` run as NEXT_PUBLIC_APP_VERSION's
          # literal TS type.
          NEXT_PUBLIC_APP_VERSION: ${{ github.event.release.tag_name || inputs.app_version }}