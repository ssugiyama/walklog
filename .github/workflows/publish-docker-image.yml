name: Publish Docker image
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      app_version:
        type: string
        required: false
        description: 'App version'
env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}

permissions:
  contents: read
  pages: write
  id-token: write
  packages: write
  attestations: write

jobs:
  push_to_registry:
    name: Push Docker image to Docker Hub
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Web
        id: web_meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-web

      - name: Build and push Web Docker image
        id: web_build
        uses: docker/build-push-action@v7
        with:
          context: web
          push: true
          tags: ${{ steps.web_meta.outputs.tags }}
          labels: ${{ steps.web_meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_FIREBASE_API_KEY=${{ secrets.FIREBASE_API_KEY }}
            NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${{ vars.FIREBASE_AUTH_DOMAIN }}
            NEXT_PUBLIC_GOOGLE_API_KEY=${{ secrets.GOOGLE_API_KEY }}
            NEXT_PUBLIC_MAP_TYPE_IDS=${{ vars.MAP_TYPE_IDS }}
            NEXT_PUBLIC_DEFAULT_CENTER=${{ vars.DEFAULT_CENTER }}
            NEXT_PUBLIC_DEFAULT_ZOOM=${{ vars.DEFAULT_ZOOM }}
            NEXT_PUBLIC_MAP_ID=${{ vars.MAP_ID }}
            NEXT_PUBLIC_SHAPE_STYLES_JSON_URL=${{ vars.SHAPE_STYLES_JSON_URL }}
            NEXT_PUBLIC_THEME_JSON_URL=${{ vars.THEME_JSON_URL }}
            NEXT_PUBLIC_APP_VERSION=${{ github.event.release.tag_name || inputs.app_version }}
        env:
          NODE_ENV: production

      - name: Generate artifact attestation for Web
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-web
          subject-digest: ${{ steps.web_build.outputs.digest }}
          push-to-registry: true

      - name: Extract metadata (tags, labels) for DB
        id: db_meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-db

      - name: Build and push DB Docker image
        id: db_build
        uses: docker/build-push-action@v7
        with:
          context: db
          push: true
          tags: ${{ steps.db_meta.outputs.tags }}
          labels: ${{ steps.db_meta.outputs.labels }}
      
      - name: Generate artifact attestation for DB
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-db
          subject-digest: ${{ steps.db_build.outputs.digest }}
          push-to-registry: true
